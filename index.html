<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Science 3D Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: chapter strip on top, studio-lit 3D stage beside a notebook panel (Parts / Full notes); Quiz Arena swaps in for both. Single dark "lab" look by choice. */
:root {
  --bg: #0a1212;
  --stage: #0d1918;
  --panel: #101b1b;
  --raise: #162524;
  --line: #233e3a;
  --fg: #e8f1ee;
  --muted: #93aca6;
  --hi: #f4d7a8;
  --accent: #ffb547;
  --accent-ink: #2a1a00;
  --good: #5fd68b;
  --bad: #ff7070;
  --display: "Baloo 2", "Hind", system-ui, sans-serif;
  --body: "Hind", "Baloo 2", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; line-height: 1; margin: 0; }
.brand p { margin: 2px 0 0; font-size: .8rem; color: var(--accent); font-weight: 600; letter-spacing: .06em; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: .95rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg); }
.subjtabs { display: flex; gap: 4px; flex: none; padding: 3px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); margin-right: 6px; }
.subj { border: 0; background: transparent; border-radius: 11px; padding: 4px 12px 3px; text-align: left; line-height: 1.15; cursor: pointer; color: inherit; }
.subj b { display: block; font-family: var(--display); font-weight: 600; font-size: .92rem; }
.subj span { font-size: .74rem; color: var(--hi); }
.subj[aria-pressed="true"] { background: var(--accent); color: #1a1205; }
.subj[aria-pressed="true"] span { color: #3a2a0a; }

.mbtn { flex: none; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 5px 12px 4px; text-align: left; line-height: 1.15; }
.mbtn b { display: block; font-family: var(--display); font-weight: 600; font-size: .95rem; }
.mbtn span { font-size: .78rem; color: var(--hi); }
.mbtn .star { color: var(--accent); margin-left: 4px; }
.mbtn[aria-current="true"] { border-color: var(--accent); background: rgba(255,181,71,.12); }
.mbtn[aria-current="true"] b { color: var(--accent); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 410px; min-height: 0; }
.stage { position: relative; min-width: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%, rgba(70,140,130,.22) 0%, rgba(0,0,0,0) 70%),
    radial-gradient(ellipse at 50% 120%, #0b1716 0%, #050a0a 100%); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(0,0,0,.55); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; min-height: 0;
  padding-block: 16px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.ptitle h2 { font-family: var(--display); font-weight: 800; font-size: 1.65rem; line-height: 1.05; margin: 0; text-wrap: balance; }
.ptitle h2 small { display: block; font-weight: 600; font-size: 1.05rem; color: var(--accent); margin-top: 2px; }
.ptitle .grp { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; font-family: var(--display); font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.pane { display: flex; flex-direction: column; gap: 14px; }
.label-sm { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 4px 10px 3px 8px; font-size: .86rem; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip:hover { border-color: var(--muted); }

.card { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-family: var(--display); font-size: 1.4rem; font-weight: 700; margin: 0; line-height: 1.1; }
.card h3 .hi { display: block; color: var(--accent); font-size: 1.08rem; font-weight: 600; }
.tag { align-self: flex-start; font-size: .75rem; border-radius: 6px; padding: 2px 8px; background: #22332f; color: var(--muted); }
.card p { margin: 0; }
.hi-p { color: var(--hi); }
.facts { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.facts li span { display: block; color: var(--hi); font-size: .92rem; }
.trick { border: 1.5px dashed var(--accent); border-radius: 10px; padding: 10px 12px; background: rgba(255,181,71,.07); }
.trick b { font-family: var(--display); color: var(--accent); }
.muted { color: var(--muted); }
.note { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.note h4 { font-family: var(--display); font-size: 1.12rem; margin: 0; line-height: 1.2; }
.note h4 span { display: block; color: var(--accent); font-weight: 600; font-size: .95rem; }
.tw { overflow-x: auto; }
table.nt { border-collapse: collapse; width: 100%; font-size: .86rem; }
.nt th, .nt td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.nt th { background: #1c2f2c; color: var(--accent); font-weight: 600; }
.nt td span, .nt th span { display: block; color: var(--hi); font-size: .8rem; font-weight: 400; }
.link-btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 16px; font-family: var(--display); font-weight: 700; align-self: flex-start; }

.hud { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 4; }
.hud button { border: 1px solid var(--line); background: rgba(16,27,27,.88); backdrop-filter: blur(6px); border-radius: 10px; padding: 7px 11px; font-size: .88rem; font-weight: 500; }
.hud button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.hud .play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-weight: 700; }
.hud .tourb { border-color: #6fcfb9; color: #9ff0dc; }
.hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: .8rem; color: var(--muted); background: rgba(10,18,18,.72); padding: 4px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; z-index: 2; }
.legend { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; background: rgba(10,18,18,.78); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .78rem; pointer-events: none; z-index: 2; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
.leaders line { stroke: #ffd38a; stroke-width: 1.2; opacity: .9; }
.leaders circle { fill: #ffd38a; stroke: #2a1a00; stroke-width: 1; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.lbl { position: absolute; transform: translate(-50%, -50%); background: rgba(10,18,18,.92); border: 1px solid #5a4a2c; border-radius: 8px; padding: 2px 9px; font-size: .78rem; line-height: 1.25; white-space: nowrap; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.lbl small { display: block; color: var(--accent); font-size: .74rem; }
.lbl.sel { border-color: var(--accent); z-index: 2; }
.tip { position: absolute; pointer-events: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .8rem; padding: 2px 8px; border-radius: 6px; transform: translate(12px, 12px); white-space: nowrap; z-index: 5; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }

.overlay { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100% - 24px));
  background: rgba(14,24,24,.95); border: 2px solid var(--accent); border-radius: 14px; padding: 10px 14px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.quiz { text-align: center; }
.overlay .q { font-family: var(--display); font-size: 1.22rem; font-weight: 700; line-height: 1.15; }
.overlay .q small { display: block; color: var(--accent); font-size: 1rem; font-weight: 600; }
.overlay .meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin-top: 4px; gap: 8px; font-variant-numeric: tabular-nums; }
.overlay .fb { font-weight: 600; min-height: 1.4em; font-size: .9rem; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); }
.overlay .row { display: flex; gap: 8px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
.overlay .row button { border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 5px 12px; font-size: .86rem; }
.overlay .row button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.tour { border-color: #6fcfb9; }
.tour p { margin: 4px 0 0; font-size: .92rem; }
.tour .step { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: #9ff0dc; font-weight: 600; }
.tbar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: #6fcfb9; transition: width .3s; }

.arena { grid-column: 1 / -1; overflow-y: auto; min-height: 0;
  padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.acard { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.acard h2 { font-family: var(--display); font-size: 1.8rem; font-weight: 800; margin: 0; line-height: 1.1; text-wrap: balance; }
.acard h2 small { display: block; color: var(--accent); font-size: 1.15rem; font-weight: 600; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-variant-numeric: tabular-nums; }
.stat b { display: block; font-family: var(--display); font-size: 1.4rem; line-height: 1.1; color: var(--accent); }
.stat span { font-size: .78rem; color: var(--muted); }
.big-btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 20px; font-family: var(--display); font-weight: 700; font-size: 1.1rem; align-self: flex-start; }
.ghost { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 600; }
.bar { height: 6px; background: var(--raise); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qhead { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--display); font-size: 1.35rem; font-weight: 700; line-height: 1.25; margin: 0; }
.qtext span { display: block; color: var(--hi); font-family: var(--body); font-size: 1.12rem; font-weight: 500; margin-top: 4px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--raise); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #22332f; font-weight: 700; font-family: var(--display); }
.opt .t span { display: block; color: var(--hi); font-size: .9rem; }
.opt.ok { border-color: var(--good); background: rgba(95,214,139,.12); }
.opt.ok .k { background: var(--good); color: #062; }
.opt.no { border-color: var(--bad); background: rgba(255,112,112,.1); }
.opt.no .k { background: var(--bad); color: #400; }
.opt:disabled { cursor: default; }
.expl { border-left: 3px solid var(--accent); padding: 6px 12px; background: rgba(255,181,71,.06); border-radius: 0 8px 8px 0; }
.review li { margin-bottom: 8px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto auto auto; }
  .main { grid-template-columns: 1fr; }
  .stage { height: 62vh; height: 62svh; min-height: 360px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .hint { font-size: .72rem; }
  .hud button { padding: 6px 9px; font-size: .8rem; }
  .legend { top: auto; bottom: 96px; }
  .acard { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {

  wall: P("Cell Wall","कोशिका भित्ति","#8bbf5a","Plant only","Rigid, non-living outer cover made of cellulose. Gives shape, strength and protection. It is freely permeable.","सेलुलोज से बनी कठोर, निर्जीव बाहरी परत। आकार, मजबूती और सुरक्षा देती है। यह पूर्ण पारगम्य है।",[["Plants: cellulose · Fungi: chitin · Bacteria: peptidoglycan","पौधे: सेलुलोज · कवक: काइटिन · जीवाणु: पेप्टिडोग्लाइकन"],["Absent in animal cells","जंतु कोशिका में अनुपस्थित"],["Robert Hooke saw dead cell walls in cork (1665)","रॉबर्ट हुक ने कॉर्क में मृत कोशिका भित्ति देखी (1665)"]],["Wall = Wooden box. Wood = cellulose.","भित्ति = लकड़ी का डिब्बा; लकड़ी = सेलुलोज।"]),

 ["Conduction & ECG|विद्युत चालन व ECG", [["SA node (pacemaker) → AV node → Bundle of His → Purkinje fibres.","SA नोड → AV नोड → हिस का बंडल → पुरकिंजे तंतु।"],["ECG waves: P = atria contract, QRS = ventricles contract, T = ventricles relax.","ECG: P = अलिंद संकुचन, QRS = निलय संकुचन, T = निलय पुनर्ध्रुवण।"],["ECG invented by Willem Einthoven (Nobel 1924).","ECG – विलेम आइंटहोवेन।"]]],

 ["Heart diseases & treatment|हृदय रोग व उपचार", [["Hypertension (high BP), atherosclerosis (fat in arteries), coronary artery disease.","उच्च रक्तचाप, धमनी काठिन्य, कोरोनरी धमनी रोग।"],["Heart attack = blocked coronary artery; angina = chest pain from low O₂ to heart muscle.","दिल का दौरा = कोरोनरी धमनी में रुकावट; एंजाइना = सीने में दर्द।"],["Treatments: angioplasty & stent, bypass (CABG), artificial pacemaker, heart transplant.","उपचार: एंजियोप्लास्टी व स्टेंट, बाईपास, कृत्रिम पेसमेकर, हृदय प्रत्यारोपण।"],["First heart transplant: Christiaan Barnard (South Africa, 1967); in India: Dr. P. Venugopal (AIIMS, 1994).","पहला हृदय प्रत्यारोपण: क्रिस्टियान बर्नार्ड (1967); भारत में: डॉ. पी. वेणुगोपाल (AIIMS, 1994)।"]]]

 ["Cerebrum in detail|प्रमस्तिष्क विस्तार से", [["Largest part (~80% of brain). Two hemispheres joined by the corpus callosum.","सबसे बड़ा भाग (~80%)। दो गोलार्ध, महासंयोजिका से जुड़े।"],["Outer cortex = grey matter (cell bodies); inner = white matter (myelinated fibres).","बाहरी कॉर्टेक्स = धूसर द्रव्य; भीतरी = श्वेत द्रव्य।"],["Folds (gyri) and grooves (sulci) increase surface area.","घुमाव (गाइरी) और खाँचे (सल्सी) सतह क्षेत्र बढ़ाते हैं।"],["Left hemisphere controls the right side of the body and vice versa.","बायाँ गोलार्ध शरीर का दायाँ भाग नियंत्रित करता है और उल्टा।"]]],

 ["Photoreceptors|प्रकाशग्राही", [["Rods (~12 crore): dim light, pigment rhodopsin (needs vitamin A) → night blindness if lacking.","छड़ (~12 करोड़): मंद प्रकाश, रोडोप्सिन (विटामिन A) → कमी से रतौंधी।"],["Cones (~60 lakh): bright light and colour, pigment iodopsin; defect → colour blindness (X-linked).","शंकु (~60 लाख): तेज प्रकाश व रंग, आयोडोप्सिन; दोष → वर्णांधता।"],["Yellow spot has only cones; blind spot has none.","पीत बिंदु में केवल शंकु; अंध बिंदु में कोई नहीं।"]]],

 heart: [["venaCava","Impure blood from the whole body arrives through the superior and inferior vena cava.","पूरे शरीर का अशुद्ध रक्त ऊर्ध्व व निम्न महाशिरा से आता है।"],["rightAtrium","It collects in the right atrium. The SA node in its wall fires to start every beat.","यह दाएँ अलिंद में जमा होता है। इसकी दीवार का SA नोड हर धड़कन शुरू करता है।"],["saNode","SA node – the natural pacemaker – sends the electric signal (about 72 times a minute).","SA नोड – प्राकृतिक पेसमेकर – लगभग 72 बार/मिनट संकेत भेजता है।"],["tricuspid","The atrium squeezes; blood passes the three-flap tricuspid valve.","अलिंद सिकुड़ता है; रक्त तीन पल्लों वाले त्रिवलनी कपाट से गुजरता है।"],["rightVentricle","The right ventricle pumps it towards the lungs.","दायाँ निलय इसे फेफड़ों की ओर पंप करता है।"],["pulmonaryArtery","Pulmonary artery – the only artery carrying impure blood – takes it to the lungs.","फुफ्फुसीय धमनी – अशुद्ध रक्त वाली एकमात्र धमनी – इसे फेफड़ों तक ले जाती है।"],["pulmonaryVeins","Blood picks up oxygen in the lungs and returns through four pulmonary veins.","फेफड़ों में ऑक्सीजन लेकर रक्त चार फुफ्फुसीय शिराओं से लौटता है।"],["leftAtrium","Pure blood fills the left atrium.","शुद्ध रक्त बाएँ अलिंद में भरता है।"],["mitral","It flows through the two-flap bicuspid (mitral) valve.","यह दो पल्लों वाले द्विवलनी कपाट से बहता है।"],["chordae","Chordae tendineae hold the valve flaps so they cannot flip back.","कंडरा रज्जु कपाट पल्लों को पलटने से रोकते हैं।"],["leftVentricle","The thick-walled left ventricle contracts with full force…","मोटी दीवार वाला बायाँ निलय पूरी ताकत से सिकुड़ता है…"],["aorta","…and sends pure blood through the aorta to the whole body. This is double circulation.","…और महाधमनी से शुद्ध रक्त पूरे शरीर में भेजता है। यही दोहरा परिसंचरण है।"],["coronary","Coronary arteries feed the heart muscle itself; a blockage here causes a heart attack.","कोरोनरी धमनियाँ हृदय पेशी को रक्त देती हैं; रुकावट से दिल का दौरा।"]],

  lymphocyte: P("Lymphocyte","लिम्फोसाइट","#8e7cc3","Immune memory","20–30% of WBCs, with a large round nucleus. B-cells make antibodies; T-cells kill infected cells.","WBC का 20–30%, बड़ा गोल केंद्रक। B-कोशिकाएँ एंटीबॉडी बनाती हैं; T-कोशिकाएँ संक्रमित कोशिकाएँ मारती हैं।",[["HIV attacks helper T-cells (CD4) → AIDS","HIV सहायक T-कोशिकाओं (CD4) पर हमला करता है"],["Smallest WBC","सबसे छोटी WBC"]],["B = Bullets (antibodies), T = Troops (killers).","B = गोलियाँ, T = सैनिक।"]),

  basophil: P("Basophil","बेसोफिल","#5a6fd1","Histamine","Rarest WBC (below 1%) with dark blue granules. Releases histamine (inflammation) and heparin (anticoagulant).","सबसे कम WBC (<1%), गहरे नीले कण। हिस्टामिन (सूजन) व हेपरिन (थक्कारोधी) छोड़ती है।",[["Heparin stops blood clotting inside vessels","हेपरिन वाहिकाओं में थक्का रोकता है"]],["Basophil = Bottom (least) in number.","बेसोफिल = सबसे कम।"]),
  platelet: P("Platelets","बिम्बाणु (प्लेटलेट्स)","#c77dbf","Clotting","Cell fragments (1.5–4 lakh per mm³, life 7–10 days) that start blood clotting.","कोशिका खंड (1.5–4 लाख/मिमी³, आयु 7–10 दिन) जो रक्त का थक्का बनाना शुरू करते हैं।",[["Clotting: thromboplastin → prothrombin → thrombin → fibrinogen → fibrin (needs Ca²⁺ and vitamin K)","थक्का: थ्रोम्बोप्लास्टिन → प्रोथ्रोम्बिन → थ्रोम्बिन → फाइब्रिनोजन → फाइब्रिन"],["Platelet count falls in dengue","डेंगू में प्लेटलेट्स घटते हैं"]],["Platelets = Plasters.","प्लेटलेट्स = प्लास्टर।"]),

  antibody: P("Antibodies","प्रतिरक्षी (एंटीबॉडी)","#ffcf5a","Y-shaped defenders","Y-shaped proteins (immunoglobulins) made by B-cells that lock onto antigens of germs and mark them for destruction.","B-कोशिकाओं द्वारा बने Y-आकार के प्रोटीन (इम्युनोग्लोब्युलिन) जो रोगाणुओं के प्रतिजन से चिपककर उन्हें नष्ट कराते हैं।",[["IgG – most abundant, crosses the placenta; IgA – in milk (colostrum); IgM – largest, made first; IgE – allergy","IgG – सबसे अधिक, अपरा पार; IgA – दूध में; IgM – सबसे बड़ी; IgE – एलर्जी"]],["GAMED = IgG, IgA, IgM, IgE, IgD.","GAMED = पाँच प्रकार।"]),
  pathogen: P("Virus (Pathogen)","विषाणु (रोगजनक)","#6fcf6f","Germ","Disease-causing germ. Its surface molecules (antigens) trigger the immune response.","रोग पैदा करने वाला सूक्ष्मजीव। इसकी सतह के अणु (प्रतिजन) प्रतिरक्षा प्रतिक्रिया जगाते हैं।",[["Antigen = anything that makes the body produce antibodies","प्रतिजन = जो एंटीबॉडी बनवाए"]],["Antigen = Antibody generator.","एंटीजन = एंटीबॉडी जनक।"]),

 kidney: [["renalArtery","Urea-rich blood enters each kidney through the renal artery.","यूरिया-युक्त रक्त वृक्क धमनी से प्रवेश करता है।"],["glomerulus","In the glomerulus blood is filtered under high pressure.","ग्लोमेरुलस में उच्च दाब पर रक्त छनता है।"],["bowman","Bowman's capsule catches the filtrate (water, salts, glucose, urea).","बोमैन संपुट निस्यंद (जल, लवण, ग्लूकोज, यूरिया) पकड़ता है।"],["pct","The PCT takes back all glucose and most of the water and salts.","PCT पूरा ग्लूकोज और अधिकांश जल-लवण वापस लेती है।"],["henle","The loop of Henle concentrates the urine.","हेनले लूप मूत्र को गाढ़ा करता है।"],["dct","The DCT fine-tunes salts and pH.","DCT लवण व pH को संतुलित करती है।"],["collecting","The collecting duct saves more water when ADH is present.","ADH होने पर संग्राहक नलिका और जल बचाती है।"],["renalVein","Clean blood leaves by the renal vein.","साफ रक्त वृक्क शिरा से निकलता है।"],["pelvis","Urine drains into the renal pelvis…","मूत्र वृक्क श्रोणि में आता है…"],["ureter","…flows down the ureters…","…मूत्रवाहिनियों से नीचे बहता है…"],["bladder","…is stored in the bladder…","…मूत्राशय में जमा होता है…"],["urethra","…and leaves through the urethra.","…और मूत्रमार्ग से बाहर निकलता है।"]],
